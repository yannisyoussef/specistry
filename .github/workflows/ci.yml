name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

env:
  # The reader is built and browser-tested against the committed TestInbox
  # fixture project; consumers point these at their own project and origin.
  SPECRA_PROJECT_ROOT: ${{ github.workspace }}/tests/fixtures/reader/testinbox
  SPECRA_SITE_URL: https://docs.example.test

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.19.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:architecture
      - run: pnpm check:licenses
      - run: pnpm check:secrets

  build:
    name: Build, coverage, and audit
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.19.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:bundle
      # Dogfoods the public `specra check` on a realistic project and proves
      # the gate can fail (SPEC-011).
      - run: pnpm check:quality
      - run: pnpm test:coverage
      - run: pnpm audit --audit-level high
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.19.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:dependencies
      - run: pnpm check:licenses
      - run: pnpm audit --audit-level high

  browser:
    name: Browser and accessibility smoke
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.19.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm exec playwright install --with-deps firefox webkit
      - run: pnpm test:cross-browser
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  dogfood:
    name: Packed CLI consumers
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.19.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Check out the reviewed Odexa consumer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: yannisyoussef/odexa
          ref: 13a472e527dc6ba899cf48e72a38e4ff1b6ee39c
          path: .specra-tooling/odexa
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - name: Pack the reviewed public CLI boundary
        run: |
          pnpm --filter @specra/cli... build
          node scripts/build-release-candidate.mjs "$RUNNER_TEMP/specra-candidate"
      - name: Reject private coupling in both consumers
        run: node scripts/check-public-boundary.mjs dogfood/specra-docs .specra-tooling/odexa
      - name: Verify Specra self-documentation through the package
        run: |
          mkdir -p "$RUNNER_TEMP/specra-self"
          npm install --prefix "$RUNNER_TEMP/specra-self" "$RUNNER_TEMP/specra-candidate/specra-cli-0.1.0-rc.1.tgz" --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/specra-self-cache"
          node "$RUNNER_TEMP/specra-self/node_modules/@specra/cli/dist/bin.js" validate --root dogfood/specra-docs
          node "$RUNNER_TEMP/specra-self/node_modules/@specra/cli/dist/bin.js" build --root dogfood/specra-docs
          node "$RUNNER_TEMP/specra-self/node_modules/@specra/cli/dist/bin.js" check --root dogfood/specra-docs
      - name: Verify Odexa through the same package
        run: python3 -B .specra-tooling/odexa/scripts/specra-docs.py --tarball "$RUNNER_TEMP/specra-candidate/specra-cli-0.1.0-rc.1.tgz"

  performance:
    name: Resource and performance evidence
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.19.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:performance
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: performance-evidence
          path: |
            tests/performance/measurements.json
            tests/performance/schema-measurements.json
            tests/performance/content-measurements.json
            tests/performance/search-measurements.json
            tests/performance/snippets-measurements.json
          if-no-files-found: ignore
          retention-days: 30
