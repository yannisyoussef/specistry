name: Publish qualified npm release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-specistry-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish identical CLI bytes
    if: github.repository == 'yannisyoussef/specistry' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version
      - name: Require exact green production source and annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-tag.mjs
      - name: Download and cryptographically verify the qualified release
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-npm-release.mjs
      - name: Publish existing tarball via npm Trusted Publishing
        env:
          QUALIFIED_TARBALL: ${{ steps.verified.outputs.tarball }}
          QUALIFIED_SHA256: ${{ steps.verified.outputs.sha256 }}
        run: node scripts/publish-npm-candidate.mjs
      - name: Fresh public npm installation and real build/check
        env:
          INSTALL_TAG: ${{ steps.verified.outputs.dist_tag }}
        run: |
          npm install --global --prefix "$RUNNER_TEMP/specistry-installed" "@specistry/cli@$INSTALL_TAG" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const actual=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/specistry-installed/lib/node_modules/@specistry/cli/package.json")); const expected=JSON.parse(readFileSync("package.json")); if(actual.name!=="@specistry/cli"||actual.version!==expected.version)throw new Error("Fresh registry installation identity mismatch");'
          "$RUNNER_TEMP/specistry-installed/bin/specistry" --help
          "$RUNNER_TEMP/specistry-installed/bin/specistry" build --root dogfood/specistry-docs
          "$RUNNER_TEMP/specistry-installed/bin/specistry" check --root dogfood/specistry-docs
