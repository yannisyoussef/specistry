packages:
  - apps/*
  - packages/*
autoInstallPeers: false
engineStrict: true
saveExact: true
strictPeerDependencies: true
audit:
  level: high
  ignore:
    # Dev-only lint tooling; no patched braces release exists as of 2026-10-05.
    # Owner: maintainers. Review by 2026-10-19 or immediately when 3.0.4 ships.
    - GHSA-vfj7-8cjw-p6xm
overrides:
  "brace-expansion@<1.1.20": 1.1.20
  "brace-expansion@>=2.0.0 <2.1.6": 2.1.6
  "brace-expansion@>=4.0.0 <5.0.11": 5.0.11
  "http-cache-semantics@<=4.2.0": 4.3.0
  "smol-toml@<=1.7.0": 1.7.1
  "undici@>=8.0.0 <8.10.2": 8.10.2
allowBuilds:
  libxmljs2: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - "@playwright/test@1.63.0"
  - playwright-core@1.63.0
  - playwright@1.63.0
