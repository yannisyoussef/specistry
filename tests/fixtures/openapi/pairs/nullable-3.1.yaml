openapi: 3.1.0
info: { title: Paired, version: 1.0.0 }
paths:
  /items:
    get:
      operationId: listItems
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
components:
  schemas:
    Item:
      type: object
      properties:
        label:
          type: [string, "null"]
        score:
          type: number
          exclusiveMinimum: 0
