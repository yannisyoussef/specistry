openapi: 3.1.0
info:
  title: Versioned API
  version: 1.0.0
servers:
  - url: https://api.versioned.test/v1
tags:
  - name: Inboxes
    description: Mail inboxes.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    Inbox:
      type: object
      required: [id, address]
      properties:
        id: { type: string }
        address: { type: string, format: email }
        expiresAt: { type: integer, description: Unix timestamp. }
security:
  - apiKey: []
paths:
  /inboxes:
    get:
      operationId: listInboxes
      summary: List inboxes
      tags: [Inboxes]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: The inboxes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Inbox" }
    post:
      operationId: createInbox
      summary: Create inbox
      tags: [Inboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inbox" }
  /inboxes/{id}/raw:
    get:
      operationId: getRawMessage
      summary: Get raw message
      tags: [Inboxes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The raw message.
          content:
            text/plain:
              schema: { type: string }
