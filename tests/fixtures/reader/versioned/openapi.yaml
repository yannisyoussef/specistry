openapi: 3.1.0
info:
  title: Versioned API
  version: 2.0.0
servers:
  - url: https://api.versioned.test/v2
tags:
  - name: Inboxes
    description: Mail inboxes.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Inbox:
      type: object
      required: [id, address]
      properties:
        id: { type: string }
        address: { type: string, format: email }
        label: { type: string }
        expiresAt: { type: string, format: date-time }
security:
  - bearer: []
paths:
  /inboxes:
    get:
      operationId: listInboxes
      summary: List inboxes
      deprecated: true
      tags: [Inboxes]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The inboxes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Inbox" }
    post:
      operationId: createInbox
      summary: Create inbox
      tags: [Inboxes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inbox" }
  /inboxes/{id}/messages/wait:
    post:
      operationId: waitForMessage
      summary: Wait for message
      tags: [Inboxes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string }
